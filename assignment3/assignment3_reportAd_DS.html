<html>

<head>

    <meta charset="UTF-8" http-equiv="refresh" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Report Form</title>
    <link rel="stylesheet" type="text/css" href="assigment3_style_DS.css">
    <script src="assignment3_java_DS.js"></script>

</head>

<body>
    <div id="report" class="container">

        <div class="highlight">

            <h2>Report Form</h2>

            <div class="form-group">

                <input type="text" id="adDesc" placeholder="Ad link or description" /><br><br>
                </div>

                <div class="form-group">
                <input type="text" id="adImage" placeholder="Upload ad screenshot" /><br><br>
                </div>

                <div class="form-group">
                <input type="text" id="reportReason" placeholder="Reason for report" /><br><br>
                </div>

                <div class="form-group">
                <input type="text" id="violationDesc" placeholder="Description of violating ad content" /><br><br>

            </div>

            <button onclick="window.location.href='assignment3_index_DS.html'">Submit Report</button>
            <p>Your report will be kept strictly confidential to protect your privacy.</p>

        </div>

    </div>

</body>


</html>
